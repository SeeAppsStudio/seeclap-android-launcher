name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tester le nettoyage sur une TV simulée
        run: python3 tools/tests/test_tv_cache.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Textes des 12 langues à jour
        run: python3 tools/strings/build.py && git diff --exit-code tv/src/main/res
      - name: Compiler, tester et analyser les deux éditions
        run: >-
          ./gradlew :app:assembleSiteRelease :app:bundlePlayRelease
          :app:testSiteDebugUnitTest :app:testPlayDebugUnitTest
          :app:lintSiteRelease :app:lintPlayRelease --no-daemon
      - name: Verify the downloaded edition has no accessibility service
        run: |
          shopt -s nullglob
          apks=(tv/build/outputs/apk/site/release/*.apk)
          test "${#apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "${apks[0]}" --file AndroidManifest.xml > site-manifest.txt
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|HomeGuardService' site-manifest.txt; then exit 1; fi
